<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ClauseIQ — AI-powered legal contract clause extraction, risk scoring, and version comparison.">
  <title>ClauseIQ — Contract Risk Analysis</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
</head>
<body>

<div class="app-container">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="logo">
      <div class="logo-icon">C</div>
      <div class="logo-text">Clause<span>IQ</span></div>
    </div>
    <nav class="tab-nav" role="tablist">
      <button class="tab-btn active" role="tab" data-tab="analyse" id="tab-analyse" aria-selected="true" aria-label="Analyse">
        ⚡ Analyse
      </button>
      <button class="tab-btn" role="tab" data-tab="compare" id="tab-compare" aria-selected="false" aria-label="Compare">
        🔀 Compare
      </button>
    </nav>
  </header>

  <!-- ── Mode A: Analyse ────────────────────────────────────────────────── -->
  <section class="mode-panel active" id="panel-analyse" role="tabpanel" aria-labelledby="tab-analyse">

    <div class="upload-section single">
      <div class="upload-zone" id="upload-analyse" tabindex="0">
        <div class="upload-icon">📄</div>
        <div class="upload-label">Drop your contract here</div>
        <div class="upload-hint">PDF or DOCX • Max 20 MB</div>
        <div class="upload-filename" id="analyse-filename"></div>
        <button class="upload-reset" id="analyse-reset" hidden>Clear</button>
        <input type="file" id="analyse-file-input" accept=".pdf,.docx,.doc">
      </div>
    </div>

    <div class="submit-row">
      <button class="submit-btn" id="analyse-submit" disabled>
        Analyse Contract
      </button>
    </div>

    <div id="analyse-error"></div>
    <div id="analyse-loading"></div>
    <div id="analyse-results"></div>

  </section>

  <!-- ── Mode B: Compare ────────────────────────────────────────────────── -->
  <section class="mode-panel" id="panel-compare" role="tabpanel" aria-labelledby="tab-compare">

    <div class="upload-section">
      <div class="upload-zone" id="upload-v1" tabindex="0">
        <div class="upload-version-label">Version 1 (Original)</div>
        <div class="upload-icon">📄</div>
        <div class="upload-label">Drop original contract</div>
        <div class="upload-hint">PDF or DOCX</div>
        <div class="upload-filename" id="v1-filename"></div>
        <button class="upload-reset" id="v1-reset" hidden>Clear</button>
        <input type="file" id="v1-file-input" accept=".pdf,.docx,.doc">
      </div>
      <div class="upload-zone" id="upload-v2" tabindex="0">
        <div class="upload-version-label">Version 2 (Revised)</div>
        <div class="upload-icon">📄</div>
        <div class="upload-label">Drop revised contract</div>
        <div class="upload-hint">PDF or DOCX</div>
        <div class="upload-filename" id="v2-filename"></div>
        <button class="upload-reset" id="v2-reset" hidden>Clear</button>
        <input type="file" id="v2-file-input" accept=".pdf,.docx,.doc">
      </div>
    </div>

    <div class="submit-row">
      <button class="submit-btn" id="compare-submit" disabled>
        Compare Versions
      </button>
    </div>

    <div id="compare-error"></div>
    <div id="compare-loading"></div>
    <div id="compare-results"></div>

  </section>

  <!-- ── Footer ─────────────────────────────────────────────────────────── -->
  <footer class="app-footer">
    ClauseIQ • AI-powered contract risk analysis
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
